version: '2'

run:
  timeout: 5m

linters:
  enable:
    - wsl_v5
  settings:
    wsl_v5:
      default: none
      cuddle-max-statements: 1
      enable:
        - if
        - for
        - range
        - switch
        - type-switch
        - select
        - after-block
  exclusions:
    paths:
      - _legacy

formatters:
  enable:
    - gofumpt
    - gci
    - golines
  settings:
    gci:
      # Import groups: stdlib, go-webthings, this site, other donseba packages, the rest.
      sections:
        - standard
        - prefix(github.com/donseba/go-webthings)
        - prefix(github.com/donseba/go-webthings-contrib)
        - prefix(github.com/donseba/go-webthings-demo)
        - prefix(github.com/donseba)
        - default
      custom-order: true
    golines:
      max-len: 130
      shorten-comments: false
  exclusions:
    paths:
      - _legacy
